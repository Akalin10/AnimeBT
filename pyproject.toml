[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animebt"
version = "1.0.0"
description = "Local anime torrent search GUI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "opencc-python-reimplemented==0.1.7"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]
gui = ["PySide6-Essentials>=6.8,<7"]

[project.gui-scripts]
animebt-gui = "animebt.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["animebt*"]

[tool.setuptools.package-data]
"animebt.gui" = ["assets/icon.png", "qml/*.qml", "qml/shaders/*.qsb"]

